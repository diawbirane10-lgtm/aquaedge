name: AquaEdge Engineering Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engineering-validation.yml'
      - 'app/ml/**'
      - 'app/telemetry/**'
      - 'scripts/run_ml_loop.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  synthetic-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run reproducible synthetic validation
        run: python scripts/run_ml_loop.py
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: aquaedge-synthetic-ml-metrics
          path: results/cycle3_runtime.json
          retention-days: 7
