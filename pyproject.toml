[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaedge"
version = "0.1.0"
description = "AquaEdge TMS-01 distributed Edge AIoT water supervision MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<4.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
  "scikit-learn>=1.5,<2.0",
  "uvicorn>=0.30,<1.0",
  "xgboost>=2.1,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0"
]
train = [
  "transformers>=4.51,<5.0",
  "datasets>=3.0,<5.0",
  "peft>=0.14,<1.0",
  "accelerate>=1.0,<2.0",
  "trl>=0.15,<1.0",
  "bitsandbytes>=0.45,<1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*", "docs*", "results*", "scripts*", "configs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
